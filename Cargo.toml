[workspace]
members = [
  "crates/vibedoc-cli",
  "crates/vibedoc-core",
  "crates/vibedoc-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Schwick3/vibedoc"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
pulldown-cmark = "0.13"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
walkdir = "2"
